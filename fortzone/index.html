<body class="light">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
      <div id="unity-logo"><img src="logo.png"></div>
      <div id="unity-progress-bar-empty" style="display: none;">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/FortzoneWebGL109.loader.js";

    // 1. Define the parts (Update these URLs to your jsDelivr links)
    const dataParts = [
      buildUrl + "/FortzoneWebGL109.data.unityweb.part1",
      buildUrl + "/FortzoneWebGL109.data.unityweb.part2"
    ];

    const config = {
      dataUrl: "", // We will fill this dynamically
      frameworkUrl: buildUrl + "/FortzoneWebGL109.framework.js.unityweb",
      codeUrl: buildUrl + "/FortzoneWebGL109.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Fahrenheit Dev",
      productName: "Fortzone Battle Royale",
      productVersion: "0.8.8",
    };

    // 2. Function to fetch and combine parts
    async function downloadAndCombine(parts) {
      const buffers = await Promise.all(parts.map(part =>
        fetch(part).then(res => {
          if (!res.ok) throw new Error(`Failed to load ${part}`);
          return res.arrayBuffer();
        })
      ));
      const blob = new Blob(buffers, { type: "application/octet-stream" });
      return URL.createObjectURL(blob);
    }

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    loadingCover.style.display = "";

    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;

    unityLoader.onload = async () => {
      try {
        // 3. Wait for parts to fuse before starting Unity
        console.log("Fusing data parts...");
        config.dataUrl = await downloadAndCombine(dataParts);

        createUnityInstance(canvas, config, (progress) => {
          spinner.style.display = "none";
          document.querySelector("#unity-progress-bar-empty").style.display = "";
          progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          loadingCover.style.display = "none";
        });
      } catch (err) {
        alert("Error loading game data: " + err);
      }
    };
    document.body.appendChild(unityLoader);
  </script>
